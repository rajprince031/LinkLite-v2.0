services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linklite-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_LOCALHOST_API: ${VITE_LOCALHOST_API}
    container_name: linklite-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
